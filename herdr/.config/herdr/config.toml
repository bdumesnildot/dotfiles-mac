onboarding = false

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[ui.sound]
enabled = true

[ui.toast]
delivery = "system"
delay_seconds = 5

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# keybindings for the file viewer plugin
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "open-file-viewer-tab"
description = "Open file viewer in a new tab"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "open-file-viewer"
description = "Open file viewer in the current tab"

[theme]
name = "catppuccin"
auto_switch = false

[experimental]
pane_history = true
